<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Okvion Learning — обучение на практике</title>
    <meta
      name="description"
      content="Okvion Learning — обучающая платформа с курсами по Linux, Docker, CI/CD, Kubernetes и облачной инфраструктуре. Изучайте теорию, закрепляйте знания в квизах и практикуйтесь прямо в браузере."
    />
    <meta
      name="keywords"
      content="обучение DevOps, курсы DevOps, Linux, Docker, Kubernetes, CI/CD, Git, облачная инфраструктура, тренажёр терминала"
    />
    <meta name="author" content="Okvion Learning" />
    <meta name="application-name" content="Okvion Learning" />
    <meta name="robots" content="index, follow" />

    <!-- Превью при публикации ссылки в мессенджерах и соцсетях. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Okvion Learning" />
    <meta property="og:title" content="Okvion Learning — обучение на практике" />
    <meta
      property="og:description"
      content="Курсы по Linux, Docker, CI/CD и Kubernetes с квизами, тренажёром терминала и практическими заданиями."
    />
    <meta property="og:image" content="/pwa-512.png" />
    <meta property="og:image:alt" content="Логотип Okvion Learning" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Okvion Learning — обучение на практике" />
    <meta
      name="twitter:description"
      content="Курсы по Linux, Docker, CI/CD и Kubernetes с квизами и практикой в браузере."
    />
    <meta name="twitter:image" content="/pwa-512.png" />

    <!-- Иконки (единый бренд с приложением) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Okvion" />
    <style>
      /* Мгновенная заставка: видна сразу, пока грузится и стартует JS —
         на медленном телефоне это не белый экран, а спиннер бренда. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b1020;
      }
      #app-splash .ring {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(120, 140, 190, 0.35);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash"><div class="ring"></div></div>
    </div>
    <noscript>
      <div style="padding: 24px; color: #e5e9f0; background: #0b1020; font-family: sans-serif">
        Для работы платформы нужно включить JavaScript в браузере.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
