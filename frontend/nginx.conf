server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Эффективная отдача статики.
  sendfile on;
  tcp_nopush on;

  # Сжатие: без него текстовые ассеты и JSON едут в полном размере (~3× трафика).
  # Покрываем и статику, и проксируемые ответы API (gzip_proxied any).
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    application/xml
    text/xml
    image/svg+xml
    application/wasm;

  # Запросы к API уходят в контейнер бэкенда по имени из docker-compose.
  location /api/ {
    proxy_pass http://backend:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://backend:8090/health;
  }

  # Service worker и манифест — без долгого кеша и с правильными типами,
  # чтобы обновление приложения доходило до устройства.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    default_type application/javascript;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
  }

  # Хешированные ассеты кешируем навсегда.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Движок песочницы (v86) и образ Linux — большие (~10 МБ), но стабильные.
  # Кешируем надолго, чтобы качались только один раз.
  location /v86/ {
    add_header Cache-Control "public, max-age=2592000";
    types { application/wasm wasm; application/javascript js; }
    default_type application/octet-stream;
    try_files $uri =404;
  }

  # index.html не кешируем: иначе после деплоя браузер держит старую версию,
  # которая ссылается на удалённые чанки — и получается белый экран.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
