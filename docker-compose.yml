services:
  db:
    image: postgres:16
    container_name: platforma_db
    environment:
      POSTGRES_USER: platforma
      POSTGRES_PASSWORD: platforma
      POSTGRES_DB: platforma
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - platforma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platforma -d platforma"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  platforma_pgdata:
