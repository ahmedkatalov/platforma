# =============================================================================
#  learn.okvionsales.ru — HTTPS-конфиг платформы обучения для host-nginx
#
#  Платформа живёт на ТОМ ЖЕ сервере, что и sales-app (okvionsales.ru),
#  но на отдельном поддомене и в своих контейнерах. Ничего чужого не трогает.
#
#  Схема:
#    host-nginx (этот файл, TLS через certbot)
#        └── проксирует всё на 127.0.0.1:8091
#              └── контейнер platforma_frontend (nginx со статикой React)
#                    ├── /api  → platforma_backend (Go, :8090)
#                    └── /     → index.html (SPA)
#
#  Порты: платформа 8090/8091, sales-app 3000/8081 — не пересекаются.
#
#  Установка (см. deploy/DEPLOY-okvionsales.md):
#    sudo cp deploy/nginx-platforma-https.conf /etc/nginx/sites-available/learn.okvionsales.ru
#    sudo ln -s /etc/nginx/sites-available/learn.okvionsales.ru /etc/nginx/sites-enabled/
#    sudo certbot certonly --webroot -w /var/www/certbot -d learn.okvionsales.ru
#    sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# --- порт 80: проверка/продление сертификата Let's Encrypt + редирект на https ---
server {
    listen 80;
    listen [::]:80;
    server_name learn.okvionsales.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- порт 443: платформа по HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx <1.25.1: убрать строку, написать `listen 443 ssl http2;`
    server_name learn.okvionsales.ru;

    ssl_certificate     /etc/letsencrypt/live/learn.okvionsales.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.okvionsales.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Базовые security-заголовки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Весь трафик (SPA + /api + /health) обслуживает контейнер platforma_frontend.
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
